app = "webiascrap-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[env]
  FLASK_ENV = "production"
  DEBUG = "false"
  LOG_FILE = "/dev/stdout"
  HOST = "0.0.0.0"
  PORT = "8000"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
